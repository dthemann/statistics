# Conda environment for the "Statistics Deep Dive" course
#
#   create :  conda env create -f environment.yml        (or: mamba env create -f environment.yml)
#   use    :  conda activate statistics-deep-dive  &&  jupyter lab
#   update :  conda env update -f environment.yml --prune
#   remove :  conda env remove -n statistics-deep-dive
#
# The version bounds are minimums; conda will install the newest compatible releases.
# The notebooks were executed and verified with: Python 3.12, numpy 2.4, pandas 3.0, scipy 1.17,
# matplotlib 3.10, seaborn 0.13, statsmodels 0.15, scikit-learn 1.8.
name: statistics-deep-dive
channels:
  - conda-forge
dependencies:
  - python=3.12
  # --- scientific stack used by every notebook ---
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - matplotlib-base>=3.7
  - seaborn>=0.12
  - statsmodels>=0.14
  - scikit-learn>=1.3
  # --- Jupyter ---
  - jupyterlab>=4.0
  - ipykernel
  # --- optional: sliders for the interactive explorers in modules 3 and 4 ---
  - ipywidgets>=8.0
